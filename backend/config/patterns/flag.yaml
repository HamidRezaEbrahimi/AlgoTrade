engine_contract:
  scenario_resolution:
    mode: first_match_by_priority
  decision_resolution:
    mode: first_match_by_order
    order_ref: decision_model.order
    behavior:
      on_invalid: stop
      on_exclude: stop
      on_morph: handoff
  required_context_paths:
    - context.point_count
    - context.trade_direction
    - context.trend_context
    - context.trend_strength
    - context.sequence
variants:
  - key: flag_4pt
    is_default: true
    point_count: 4
    min_points: 4
    names:
      fa: فلگ ۴نقطه
      en: Flag 4pt
    rules:
      prerequisites:
        - id: flag4
          severity: fail
          expr_cel: features.metrics.wave_a_retr <= 0.11
          title_fa: ۴نقطه
          title_en: 4pt
          message_fa: ''
          message_en: ''
      bounds:
        max_retr: 0.11
    lifecycle:
      min_points: 4
      completion_when_cel: features.completion.i2_crossed_P4
      failure_when_cel: '!features.structure_valid'
    ui_defaults:
      toolbar:
        mark: true
        strength: auto
        direction: auto
  - key: flag_6pt
    point_count: 6
    min_points: 6
    names:
      fa: فلگ ۶نقطه
      en: Flag 6pt
    rules:
      prerequisites:
