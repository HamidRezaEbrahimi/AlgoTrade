_meta:
  schema_version: 1.1.0
  pattern_version: 2.0.0
  updated_at: '2026-02-20'
  source: pattern_definitions.yaml
  engine:
    expr_lang: cel
    mode: hybrid_features_first
_policy_ref:
  use: config/policies/edit_policy.global.yaml
  overrides: []
pattern:
  key: flag
  id: 101
  family: continuation
  subtype: flag
  names:
    fa: فلگ
    en: Flag
texts:
  doc:
    fa: تعریف فلگ با سیاست جهت/شیب/RR
    en: Flag with direction/slope/RR policy
  description:
    fa: ستاپ‌ها حول P2/P4 و استاپ نزدیک P0
    en: Entries around P2/P4 with stop near P0
  notes:
    fa: i2 باید خلاف C باشد؛ RR<1 تایید نمی‌شود
    en: i2 must oppose C; RR<1 is rejected
geometry:
  point_model:
    type: Npt
    points:
      - id: P0
        ref: impulse1.start
      - id: P1
        ref: impulse1.end
      - id: P2
        ref: A.end
      - id: P3
        ref: B.end
      - id: P4
        ref: C.end
      - id: P5
        ref: impulse2.end
    wave_map:
      impulse1:
        start: P0
        end: P1
      A:
        start: P1
        end: P2
      B:
        start: P2
        end: P3
      C:
        start: P3
        end: P4
      impulse2:
        start: P4
        end: P5
  explain_fa: مدل ۶نقطه
  explain_en: 6-point model
ui_editing:
  editable_sections:
    - texts.doc
    - texts.description
    - texts.notes
    - numbers
    - rules
    - transitions
    - decision_model
    - invalidations
    - lifecycle
    - quality
    - entry_setups
    - outcome_scenarios
    - feature_catalog
    - engine_contract
numbers:
  ratios:
    - key: wave_a_retr
      title_fa: wave_a_retr
      title_en: wave_a_retr
      min: 0.0
      max: 0.3
      typical: 0.18
      display:
        formula_fa: ''
        formula_en: ''
      feature_ref: features.metrics.wave_a_retr
    - key: range_ratio
      title_fa: range_ratio
      title_en: range_ratio
      min: 0.0
      max: 0.75
      typical: 0.35
      display:
        formula_fa: ''
        formula_en: ''
      feature_ref: features.metrics.range_ratio
  thresholds:
    - key: i2_slope_ratio
      title_fa: شیب i2
      title_en: i2 slope
      min: 0.0
      typical: 1.1
      levels:
        weak: 0.7
        normal: 1.0
        strong: 1.2
      feature_ref: features.impulses.i2_slope_ratio
    - key: rr_entry_b
      title_fa: RR ورود B
      title_en: RR entry B
      min: 0.0
      typical: 1.2
      levels:
        weak: 1.0
        normal: 1.0
        strong: 1.5
      feature_ref: features.rr.by_entry.entry_b
  probabilities:
    occurrence:
      value: 0.5
      text_fa: تخمینی
      text_en: Estimated
    success:
      value: 0.6
      text_fa: تخمینی
      text_en: Estimated
  success_profiles:
    by_entry_type:
      entry_a:
        value: 0.55
        text_fa: A
        text_en: A
      entry_b:
        value: 0.65
        text_fa: B
        text_en: B
error_catalog:
  structure: []
  ratios: []
  completion: []
  quality: []
rules:
  structure:
    - id: flag_bound
      severity: fail
      title_fa: مرز فلگ
      title_en: flag bounds
      expr_cel: features.ratios.a_retrace <= 0.55 && features.metrics.time_ratio <=
        10.0
    - id: b_time_vs_a_time
      severity: fail
      title_fa: زمان موج B مساوی یا بیشتر از موج A است
      title_en: b time >= a time
      expr_cel: features.metrics.b_time >= features.metrics.a_time
  ratios: []
  completion: []
  quality: []
transitions:
  can_morph_to: []
decision_model:
  order:
    - exclude
    - invalid
    - morph
    - valid
  notes_fa: exclude->invalid->morph->valid
invalidations:
  rules: []
lifecycle:
  explain_fa: چرخه تشکیل تا تکمیل
  explain_en: lifecycle
  min_points: 5
  stages:
    - key: forming
      when_cel: context.point_count < 3
    - key: a_done
      when_cel: context.point_count >= 3
    - key: b_done
      when_cel: context.point_count >= 4
    - key: c_done
      when_cel: context.point_count >= 5
    - key: complete
      when_cel: features.completion.i2_crossed_P4
quality:
  strength:
    model: policy_bucket
    weights:
      direction: 0.34
      slope: 0.33
      rr: 0.33
    thresholds:
      strong: 0.7
      normal: 0.5
  confidence:
    model: weighted_sum
    factors:
      structure: 0.4
      direction: 0.3
      risk_reward: 0.3
    thresholds:
      high: 0.75
      medium: 0.5
  risk_flags:
    - id: high_risk_high_reward
      level: high
      error_code: RISK_HR_HR
      when_cel: features.risk.high_risk_high_reward
      message_fa: ریسک بالا/ریوارد بالا
      message_en: high risk high reward
    - id: high_risk_low_reward
      level: high
      error_code: RISK_HR_LR
      when_cel: features.risk.high_risk_low_reward
      message_fa: ریسک بالا/ریوارد پایین
      message_en: high risk low reward
entry_setups:
  - id: FLG-A
    name_fa: ورود A (P2)
    label_fa: ورود A
    label_en: Entry A
    style: aggressive
    rationale_fa: ورود زودهنگام اطراف P2
    trigger_cel: features.progress.impulse2_started && features.rr.by_entry.entry_a
      >= 1.0 && features.direction.i2_opposes_C
    entry_zone:
      point_ref: P2
    stop_zone:
      point_ref: P0
    target_zone:
      point_ref: P5
    rr_calculation: '|P5-P2|/|P2-P0|'
    rr_gate:
      reject_below: 1.0
      confirmable_from: 1.0
      strong_from: 1.5
    confirmation_hooks:
      - features.direction.i2_opposes_C
      - features.impulses.i2_slope_ratio
    stop_cel: features.risk.stop_distance >= 0.0
    confirms:
      - cel: features.direction.i2_opposes_C
        label_fa: جهت i2 خلاف C
        label_en: i2 opposes C
      - cel: features.impulses.i2_slope_ratio >= 0.7
        label_fa: شیب تایید
        label_en: slope confirm
    risk_reward_fa: RR<1 رد
    risk_reward_en: RR<1 reject
    editable: true
  - id: FLG-B
    name_fa: ورود B (P4)
    label_fa: ورود B
    label_en: Entry B
    style: conservative
    rationale_fa: ورود دیرتر اطراف P4
    trigger_cel: features.completion.i2_crossed_P4 && features.rr.by_entry.entry_b
      >= 1.0 && features.direction.i2_opposes_C
    entry_zone:
      point_ref: P4
    stop_zone:
      point_ref: P0
    target_zone:
      point_ref: P5
    rr_calculation: '|P5-P4|/|P4-P0|'
    rr_gate:
      reject_below: 1.0
      confirmable_from: 1.0
      strong_from: 1.5
    confirmation_hooks:
      - features.direction.i2_opposes_C
      - features.impulses.i2_slope_ratio
    stop_cel: features.risk.stop_distance >= 0.0
    confirms:
      - cel: features.direction.i2_opposes_C
        label_fa: جهت i2 خلاف C
        label_en: i2 opposes C
      - cel: features.impulses.i2_slope_ratio >= 0.7
        label_fa: شیب تایید
        label_en: slope confirm
      - cel: features.rr.by_entry.entry_b >= 1.0
        label_fa: RR تایید
        label_en: RR confirm
    risk_reward_fa: RR<1 رد
    risk_reward_en: RR<1 reject
    editable: true
outcome_scenarios:
  - id: FILTERED_FLAG
    priority: 0
    conditions_cel:
      all:
        - '!features.structure_valid'
    outcome:
      comp: false
      valid: false
      succ: false
      mark: false
      reason_code: FILTERED
      reason_fa: ❌ ساختار نامعتبر
      description_fa: ساختار پایه معتبر نیست.
      description_en: Invalid structure.
      risk_override: ultra_high
      reward_override: low
      strength_override: weak
  - id: FAIL_DIRECTION_FLAG
    priority: 1
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_same_as_C
    outcome:
      comp: false
      valid: false
      succ: false
      mark: false
      reason_code: BLOCK_DIRECTION_VIOLATION
      reason_fa: '❌ Fail: نقض جهت'
      description_fa: i2 هم‌جهت C است؛ الگو Fail محسوب می‌شود.
      description_en: Direction gate failed.
      risk_override: high
      reward_override: low
      strength_override: weak
  - id: REJECT_RR_LT_1_FLAG
    priority: 5
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_opposes_C
        - features.completion.i2_crossed_P4
        - features.rr.by_entry.entry_b < 1.0
    outcome:
      comp: true
      valid: false
      succ: false
      mark: false
      reason_code: BLOCK_RR_BELOW_1
      reason_fa: '❌ NOT_TRADABLE: RR<1'
      description_fa: با وجود تکمیل ساختاری، RR ورود فعال کمتر از 1 است.
      description_en: RR below 1.
      risk_override: high
      reward_override: low
      strength_override: weak
  - id: PENDING_FLAG
    priority: 10
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - '!features.completion.i2_crossed_P4'
    outcome:
      comp: false
      valid: true
      succ: false
      mark: true
      reason_code: COMPLETION_REQUIRES_P4_CROSS
      reason_fa: ⏳ در انتظار عبور از P4
      description_fa: تا عبور i2 از P4، الگو تکمیل نیست.
      description_en: Pending P4 cross.
      risk_override: medium
      reward_override: medium
      strength_override: normal
  - id: IDEAL_EXECUTION_FLAG
    priority: 29
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_opposes_C
        - features.completion.i2_crossed_P4
        - features.impulses.i2_slope_ratio >= 0.7
        - features.rr.by_entry.entry_b >= 1.5
    outcome:
      comp: true
      valid: true
      succ: true
      mark: true
      reason_code: IDEAL_EXECUTION_BY_RR
      reason_fa: 🏆 IDEAL_EXECUTION
      description_fa: RR بالا با شیب قابل قبول.
      description_en: Ideal execution by RR.
      risk_override: low
      reward_override: high
      strength_override: normal
  - id: COMPLETE_WEAK_FLAG
    priority: 30
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_opposes_C
        - features.completion.i2_crossed_P4
        - features.rr.by_entry.entry_b >= 1.0
        - features.impulses.i2_slope_ratio < 0.7
    outcome:
      comp: true
      valid: true
      succ: true
      mark: true
      reason_code: COMPLETE_WEAK_SLOPE_LT_0_7
      reason_fa: ⚠️ COMPLETE_WEAK
      description_fa: عبور از P4 انجام شده ولی شیب کمتر از 0.7 است.
      description_en: Complete weak.
      risk_override: medium
      reward_override: low
      strength_override: weak
  - id: COMPLETE_NORMAL_FLAG
    priority: 31
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_opposes_C
        - features.completion.i2_crossed_P4
        - features.rr.by_entry.entry_b >= 1.0
        - features.impulses.i2_slope_ratio >= 0.7
        - features.impulses.i2_slope_ratio < 1.0
    outcome:
      comp: true
      valid: true
      succ: true
      mark: true
      reason_code: COMPLETE_NORMAL_SLOPE_0_7_TO_1
      reason_fa: ✅ COMPLETE_NORMAL
      description_fa: عبور از P4 با شیب 0.7 تا 1.
      description_en: Complete normal.
      risk_override: medium
      reward_override: medium
      strength_override: normal
  - id: COMPLETE_CONFIRMED_FLAG
    priority: 32
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_opposes_C
        - features.completion.i2_crossed_P4
        - features.rr.by_entry.entry_b >= 1.0
        - features.impulses.i2_slope_ratio >= 1.0
        - features.impulses.i2_slope_ratio < 1.2
    outcome:
      comp: true
      valid: true
      succ: true
      mark: true
      reason_code: COMPLETE_CONFIRMED_SLOPE_1_TO_1_2
      reason_fa: ✅ COMPLETE_CONFIRMED
      description_fa: عبور از P4 با شیب 1 تا 1.2.
      description_en: Complete confirmed.
      risk_override: medium
      reward_override: high
      strength_override: normal
  - id: COMPLETE_STRONG_FLAG
    priority: 33
    conditions_cel:
      all:
        - features.structure_valid
        - features.metrics.wave_a_retr <= 0.30
        - features.metrics.time_ratio <= 0.75
        - features.metrics.range_ratio <= 0.75
        - features.direction.i2_opposes_C
        - features.completion.i2_crossed_P4
        - features.rr.by_entry.entry_b >= 1.0
        - features.impulses.i2_slope_ratio >= 1.2
    outcome:
      comp: true
      valid: true
      succ: true
      mark: true
      reason_code: COMPLETE_STRONG_SLOPE_GE_1_2
      reason_fa: ✅ COMPLETE_STRONG
      description_fa: عبور از P4 با شیب بالای 1.2.
      description_en: Complete strong.
      risk_override: low
      reward_override: high
      strength_override: strong
  - id: FALLBACK_LAST_FLAG
    priority: 999
    conditions_cel:
      all: []
    outcome:
      comp: false
      valid: true
      succ: false
      mark: false
      reason_code: FALLBACK
      reason_fa: ℹ️ پیش‌فرض
      description_fa: نیاز به بازبینی شرایط.
      description_en: Fallback.
      risk_override: medium
      reward_override: medium
      strength_override: normal
ui_defaults:
  toolbar:
    mark: true
    strength: auto
    direction: auto
