meta:
  schema_version: "1.0"
  strategy_version: "1.0.0"
  engine:
    mode: "hybrid_ai_copilot"

strategy:
  key: "liq_sweep_ob_fvg"
  names:
    fa: "جاروی نقدینگی + اردر بلاک تقاضا + FVG (Liquidity Sweep Confluence)"
    en: "Liquidity Sweep + Order Block + FVG Confluence"
  family: "smart_money"
  description:
    fa: >
      ردپای کامل پول هوشمند: جاروی استاپ‌های نقدینگی، تشکیل اردر بلاک تازه تقاضا و پر شدن FVG
      با نسبت سود به ریسک استثنایی ۱:۳.۵ و ترلینگ استاپ.
    en: >
      Clean institutional footprint: Key liquidity sweep, fresh Demand OB formation, and FVG mitigation
      with 1:3.5 risk/reward trailing exit.
  tags: ["liquidity-sweep", "order-block", "fvg", "smc", "ai-copilot"]
  is_builtin: true

timeframes:
  structure: "4h"
  entry: "1h"
  filter: "15m"

patterns:
  - "bullish_bos"
  - "demand_order_block"
  - "fvg_mitigation"
  - "support_resistance"

candlesticks:
  - "bullish_engulfing"
  - "bullish_pinbar"
  - "hammer"

parameters:
  min_score: 7
  min_rr: 2.0
  rsi_range:
    long: [35, 70]
  volume_min_ratio: 1.2
  require_ai_confirmation: true

entry_conditions:
  all:
    - "features.structure.bullish_bos"
    - "features.location.order_block_mitigated"
    - "features.volume.above_ma10"
    - "features.ai_agent.approved"
    - "features.rr.gte_2_0"

exit_rules:
  stop_loss:
    method: "swing_low"
    margin_pct: 0.15
  targets:
    tp1:
      risk_reward: 1.5
      auto_breakeven: true
    tp2:
      risk_reward: 3.5
      trailing_stop: true
      partial_close_pct: 50
