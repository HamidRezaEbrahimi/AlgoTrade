meta:
  schema_version: "1.0"
  strategy_version: "1.0.0"
  engine:
    mode: "hybrid_ai_copilot"

strategy:
  key: "mtf_bos_demand_continuation"
  names:
    fa: "ادامه روند چندتایم‌فریمه با شکست ساختار و تقاضا (Multi-TF BOS Continuation)"
    en: "Multi-TF Confluence Continuation (BOS + Demand/Supply)"
  family: "continuation"
  description:
    fa: >
      همگرایی ۳ تایم‌فریمه: ساختار صعودی ۴ ساعته + الگوی ادامه‌دهنده پرچم/سطح تقاضای ۱ ساعته
      + تریگر شتاب ۱۵ دقیقه با نسبت سود ۲.۰R در تارگت اول و ۳.۵R در تارگت دوم.
    en: >
      Triple confluence alignment: 4H bullish structure + 1H demand level/flag continuation
      + 15M momentum trigger with 2.0R TP1 and 3.5R TP2.
  tags: ["continuation", "multi-timeframe", "bos", "flag", "demand"]
  is_builtin: true

timeframes:
  structure: "4h"
  entry: "1h"
  filter: "15m"

patterns:
  - "flag"
  - "bullish_bos"
  - "demand_order_block"
  - "fvg_mitigation"
  - "support_resistance"

candlesticks:
  - "bullish_engulfing"
  - "bullish_pinbar"

parameters:
  min_score: 7
  min_rr: 2.0
  rsi_range:
    long: [45, 70]
  volume_min_ratio: 1.2
  require_ai_confirmation: true

entry_conditions:
  all:
    - "features.structure.bullish_bos"
    - "features.location.order_block_mitigated"
    - "features.volume.above_ma10"
    - "features.ai_agent.approved"
    - "features.rr.gte_2_0"

exit_rules:
  stop_loss:
    method: "swing_low"
    margin_pct: 0.15
  targets:
    tp1:
      risk_reward: 2.0
      auto_breakeven: true
    tp2:
      risk_reward: 3.5
      trailing_stop: true
      partial_close_pct: 50
