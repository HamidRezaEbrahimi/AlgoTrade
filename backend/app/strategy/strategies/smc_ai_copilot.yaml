meta:
  schema_version: "1.0"
  strategy_version: "1.0.0"
  engine:
    mode: "hybrid_ai_copilot"

strategy:
  key: "smc_ai_copilot"
  names:
    fa: "پرایس‌اکشن اسمارت‌مانی + تاییدیه هوش مصنوعی (AI Copilot)"
    en: "SMC Price Action + AI Agent Confirmation Gate"
  family: "smart_money"
  description:
    fa: >
      استراتژی پیشرفته اسمارت مانی با دروازه اعتبارسنجی هوش مصنوعی:
      تشخیص شکست ساختار (BOS)، پر شدن گپ FVG و اخذ تاییدیه تحلیلی از Agent قبل از ورود.
    en: >
      Advanced Smart Money strategy with AI validation gate:
      BOS detection, FVG mitigation and analytical greenlight from AI Copilot before execution.
  tags: ["ai-copilot", "smc", "fvg", "bos", "order-block"]
  is_builtin: true

timeframes:
  structure: "4h"
  entry: "1h"
  filter: "15m"

patterns:
  - "bullish_bos"
  - "fvg_mitigation"
  - "demand_order_block"

parameters:
  min_score: 7
  min_rr: 1.8
  rsi_range:
    long: [42, 68]
  volume_min_ratio: 1.1
  require_ai_confirmation: true

entry_conditions:
  all:
    - "features.structure.bullish_bos"
    - "features.location.fvg_mitigated"
    - "features.ai_agent.approved"
    - "features.rr.gte_1_8"

exit_rules:
  stop_loss:
    method: "swing_low"
    margin_pct: 0.2
  targets:
    tp1:
      risk_reward: 1.5
      auto_breakeven: true
    tp2:
      risk_reward: 2.5
      trailing_stop: true
      partial_close_pct: 50
