meta:
  schema_version: "1.0"
  strategy_version: "1.0.0"
  engine:
    mode: "hybrid_ai_copilot"

strategy:
  key: "smc_ob_mitigation"
  names:
    fa: "میتریگیشن اردر بلاک کلاسیک SMC (Order Block Mitigation)"
    en: "Classic SMC Structure + Order Block Mitigation"
  family: "smart_money"
  description:
    fa: >
      ستاپ استاندارد اسمارت مانی در جهت ساختار صعودی ۴ ساعته، ورود در پولبک به Order Block
      با تایید حجم و کندل پوشا یا پین‌بار.
    en: >
      Standard Smart Money setup aligning with 4H bullish structure, entering on Demand Order Block
      mitigation with volume and candlestick confirmation.
  tags: ["smc", "order-block", "mitigation", "trend-following"]
  is_builtin: true

timeframes:
  structure: "4h"
  entry: "1h"
  filter: "15m"

patterns:
  - "bullish_bos"
  - "demand_order_block"
  - "support_resistance"

candlesticks:
  - "bullish_engulfing"
  - "bullish_pinbar"
  - "hammer"

parameters:
  min_score: 6
  min_rr: 2.0
  rsi_range:
    long: [40, 65]
  volume_min_ratio: 1.1
  require_ai_confirmation: true

entry_conditions:
  all:
    - "features.structure.bullish_bos"
    - "features.location.order_block_mitigated"
    - "features.volume.above_ma10"
    - "features.ai_agent.approved"
    - "features.rr.gte_2_0"

exit_rules:
  stop_loss:
    method: "swing_low"
    margin_pct: 0.2
  targets:
    tp1:
      risk_reward: 1.5
      auto_breakeven: true
    tp2:
      risk_reward: 3.0
      trailing_stop: true
      partial_close_pct: 50
