meta:
  schema_version: "1.0"
  strategy_version: "1.0.0"
  engine:
    mode: "hybrid_ai_copilot"

strategy:
  key: "ict_silver_bullet_pm"
  names:
    fa: "گلوله نقره‌ای ICT سشن بعدازظهر (ICT Silver Bullet PM)"
    en: "ICT Silver Bullet PM Session Model"
  family: "smart_money"
  description:
    fa: >
      مدل گلوله نقره‌ای ICT در پنجره زمانی مشخص پس از جارو کردن نقدینگی (Liquidity Sweep)
      و تشکیل FVG در ناحیه دیسکانت با تاییدیه کندلی و استدلال هوش مصنوعی.
    en: >
      ICT Silver Bullet execution inside specific kill-zone window after liquidity sweep,
      entering on FVG in discount zone with AI Copilot confirmation.
  tags: ["ict", "silver-bullet", "fvg", "liquidity-sweep", "ai-copilot"]
  is_builtin: true

timeframes:
  structure: "4h"
  entry: "1h"
  filter: "15m"

patterns:
  - "bullish_bos"
  - "demand_order_block"
  - "fvg_mitigation"
  - "support_resistance"

candlesticks:
  - "bullish_engulfing"
  - "bullish_pinbar"

parameters:
  min_score: 7
  min_rr: 2.0
  rsi_range:
    long: [40, 70]
  volume_min_ratio: 1.2
  require_ai_confirmation: true

entry_conditions:
  all:
    - "features.structure.bullish_bos"
    - "features.location.fvg_mitigated"
    - "features.volume.above_ma10"
    - "features.ai_agent.approved"
    - "features.rr.gte_2_0"

exit_rules:
  stop_loss:
    method: "swing_low"
    margin_pct: 0.15
  targets:
    tp1:
      risk_reward: 1.5
      auto_breakeven: true
    tp2:
      risk_reward: 3.0
      trailing_stop: true
      partial_close_pct: 50
