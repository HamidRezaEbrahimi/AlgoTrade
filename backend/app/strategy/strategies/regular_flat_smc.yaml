meta:
  schema_version: "1.0"
  strategy_version: "1.0.0"
  engine:
    mode: "hybrid_pattern_indicator"

strategy:
  key: "regular_flat_smc"
  names:
    fa: "امواج اصلاحی Flat + اردر بلاک تقاضا و پرایس‌اکشن"
    en: "Regular Flat Waves + SMC Demand Order Block"
  family: "reversal_continuation"
  description:
    fa: >
      تشخیص انتهای اصلاح امواج فلت ۶ نقطه‌ای الیوت در محدوده اردر بلاک تقاضا (Demand OB)،
      با تایید کندل پین‌بار یا پوشا و چرخش RSI از اشباع فروش.
    en: >
      Detects the completion of 6-point Regular Flat corrective wave within Demand Order Block,
      confirmed by Pin Bar or Engulfing candlestick and RSI reversal.
  tags: ["hybrid", "wave-flat", "smc", "order-block", "price-action"]
  is_builtin: true

timeframes:
  structure: "4h"
  entry: "1h"
  filter: "15m"

patterns:
  - "regular_flat_6pt"
  - "order_block_demand"
  - "bullish_pin_bar"

parameters:
  min_score: 6
  min_rr: 2.0
  rsi_range:
    long: [35, 65]
  volume_min_ratio: 1.0
  require_ai_confirmation: false

entry_conditions:
  all:
    - "features.pattern.flat_wave_c_completed"
    - "features.location.in_demand_order_block"
    - "features.candlestick.reversal_confirmed"
    - "features.rr.gte_2_0"

exit_rules:
  stop_loss:
    method: "wave_c_low"
    margin_pct: 0.15
  targets:
    tp1:
      risk_reward: 1.5
      auto_breakeven: true
    tp2:
      risk_reward: 2.5
      trailing_stop: true
      partial_close_pct: 50
