#   tags: ["momentum", "trend"]
#
# parameters:
#   min_score: 6
#   min_rr: 1.5
#   rsi_range: { long: [40, 70], short: [30, 60] }
#   volume_period: 10
#   ...any custom key-value pairs...
#
# entry_conditions:
#   all:
#     - "features.structure.valid"
#     - "features.pattern.confirmed"
#     - "features.rr.value >= 1.5"
#   any: []
#   none:
#     - "features.invalidated"
