# Strategy YAML Schema v1.0
# Every strategy YAML file must follow this structure.

# ─── Required Top-Level Keys ───
# meta:           Versioning and authorship metadata
# strategy:       Identity (key, names, family)
# entry_conditions: Conditions block (all/any/none) for signal generation
# exit_rules:     Stop loss, trailing, and target definitions
# outcome_scenarios: Priority-ordered scenario matching (first_match)
# parameters:     Configurable thresholds (editable by user)

# ─── Example Skeleton ───
# meta:
#   schema_version: "1.0"
#   strategy_version: "1.0.0"
#   engine: { mode: "price_action" | "wave_pattern" }
#
# strategy:
#   key: "my_strategy"
#   names: { fa: "استراتژی من", en: "My Strategy" }
