version: "3.9"

services:
  # ── PostgreSQL Database ───────────────────
  postgres:
    image: postgres:16-alpine
    container_name: algotrade-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-algotrade}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-algotrade}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Redis (Cache & Real-Time Buffer) ───────
  redis:
    image: redis:7-alpine
    container_name: algotrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ── Backend (FastAPI + Strategy Engine) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algotrade-backend
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend (Vite + React) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algotrade-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  redis-data:
